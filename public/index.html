<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8b8fd6">
<title>GistApp — Email Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--grad:linear-gradient(135deg,#7b8cff,#b58cff);--online:#30d158;--ink:#1c1c22;--sub:#8e8e96;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#fff}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.active{display:flex}
.avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;flex-shrink:0;user-select:none}
.btn{border:none;border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
.btn:active{transform:scale(.97)}
.icn{width:40px;height:40px;border-radius:50%;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}

/* AUTH */
#auth{align-items:center;justify-content:center;background:linear-gradient(160deg,#8b8fd6,#b3a9dd 60%,#f4f1ff);padding:24px}
.auth-card{width:100%;max-width:420px;background:#fff;border-radius:28px;padding:30px 24px;box-shadow:0 30px 70px rgba(30,25,60,.25)}
.auth-card h1{font-size:26px;font-weight:800;color:var(--ink);margin-bottom:6px}
.auth-card p{font-size:13.5px;color:var(--sub);margin-bottom:22px}
.auth-card input{width:100%;height:52px;border-radius:16px;border:1.5px solid #e8e5f0;background:#faf9fd;padding:0 16px;font-size:15px;color:var(--ink);outline:none;margin-bottom:12px;transition:.15s}
.auth-card input:focus{border-color:#8b8fd6;background:#fff}
.auth-card .btn{width:100%;height:52px;background:#14141a;color:#fff;margin-top:6px}
.auth-swap{text-align:center;font-size:13.5px;color:var(--sub);margin-top:16px}
.auth-swap a{color:#6a62b8;font-weight:700;cursor:pointer;text-decoration:none}
.err{color:#e5484d;font-size:12.5px;font-weight:600;margin-bottom:8px;min-height:16px}

/* LIST */
#list{background:#fff}
.list-top{background:linear-gradient(180deg,#8b8fd6 0%,#b3a9dd 62%,#fff 100%);padding:calc(20px + var(--safe-t)) 20px 14px}
.list-top .row{display:flex;gap:10px;align-items:center}
.search-pill{flex:1;height:42px;border-radius:21px;background:rgba(255,255,255,.4);backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;padding:0 16px;color:#fff}
.search-pill input{background:none;border:none;outline:none;color:#fff;font-size:14px;width:100%}
.search-pill input::placeholder{color:rgba(255,255,255,.85)}
.list-title{color:#fff;font-size:28px;font-weight:800;margin:16px 0 6px;letter-spacing:-.5px}
.me-bar{display:flex;align-items:center;gap:10px;padding:8px 20px 10px;border-bottom:1px solid #f2eff8}
.me-bar .avatar{width:36px;height:36px;font-size:13px}
.me-bar b{font-size:13.5px;color:var(--ink)}
.me-bar small{font-size:11.5px;color:var(--sub)}
.chats{flex:1;overflow-y:auto;padding:8px 0 90px}
.chat-item{display:flex;align-items:center;gap:13px;padding:12px 20px;cursor:pointer;transition:.15s}
.chat-item:hover{background:#f4f2fb}
.chat-item:active{background:#eeebf9}
.chat-item .avatar{width:50px;height:50px;font-size:16px}
.chat-item .meta{flex:1;min-width:0}
.chat-item .meta b{font-size:15px;font-weight:700;color:var(--ink);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .meta small{font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;margin-top:2px}
.empty{padding:50px 20px;text-align:center;color:#a5a1b0;font-size:14px}
.fab{position:absolute;right:20px;bottom:calc(24px + var(--safe-b));height:56px;padding:0 22px;border-radius:28px;background:#14141a;color:#fff;border:none;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;cursor:pointer;box-shadow:0 12px 26px rgba(20,20,26,.35);z-index:5}
.logout{position:absolute;left:20px;bottom:calc(24px + var(--safe-b));background:#f2f1f7;color:var(--ink);border:none;border-radius:14px;padding:10px 16px;font-size:13px;font-weight:600;cursor:pointer}

/* CHAT */
#chat{background:linear-gradient(180deg,#9fa2dd 0%,#c8bce6 58%,#b6b1de 100%)}
.chat-head{display:flex;align-items:center;gap:12px;padding:calc(16px + var(--safe-t)) 16px 12px;color:#fff;flex-shrink:0}
.chat-head .avatar{width:44px;height:44px;font-size:16px;border:2px solid rgba(255,255,255,.7)}
.chat-head .who{min-width:0;flex:1}
.chat-head .who b{font-size:18px;font-weight:800;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .who small{font-size:11.5px;opacity:.9}
.chat-head .back{background:rgba(30,32,58,.55);color:#fff}
.chat-body{flex:1;overflow-y:auto;padding:8px 16px 12px;display:flex;flex-direction:column;gap:8px;scrollbar-width:none}
.chat-body::-webkit-scrollbar{display:none}
#msgs{display:flex;flex-direction:column;gap:8px}
.bubble{max-width:min(78%,600px);padding:10px 14px;font-size:14.5px;line-height:1.45;word-wrap:break-word;overflow-wrap:anywhere;animation:pop .25s}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}to{opacity:1;transform:none}}
.bubble.in{align-self:flex-start;background:rgba(255,255,255,.78);color:#2e2c3d;border-radius:19px 19px 19px 6px;box-shadow:0 4px 14px rgba(70,60,120,.12)}
.bubble.out{align-self:flex-end;background:#33344c;color:#fff;border-radius:19px 19px 6px 19px}
.bubble .t{display:block;font-size:10px;opacity:.55;margin-top:4px;text-align:right;font-weight:600}
.typing{align-self:center;display:none;align-items:center;gap:8px;background:#a7e56e;color:#20330f;font-size:12.5px;font-weight:600;border-radius:16px;padding:6px 13px;margin:6px auto}
.typing .dots{display:inline-flex;gap:2px}
.typing .dots i{width:4px;height:4px;border-radius:50%;background:#3c5a17;animation:blink 1s infinite}
.typing .dots i:nth-child(2){animation-delay:.2s}
.typing .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.chat-input{margin:6px 14px calc(14px + var(--safe-b));display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.6);border-radius:27px;padding:7px 7px 7px 18px;backdrop-filter:blur(6px);flex-shrink:0}
.chat-input input{flex:1;background:none;border:none;outline:none;font-size:14px;color:#2e2c3d;min-width:0}
.chat-input input::placeholder{color:#6f6a92}
.chat-input button{width:42px;height:42px;border-radius:50%;background:#23242f;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.chat-input button:active{transform:scale(.9)}

/* MODAL */
.modal-wrap{position:absolute;inset:0;background:rgba(18,16,28,.5);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:22px;z-index:50}
.modal-wrap.show{display:flex}
.modal{width:100%;max-width:400px;background:#fff;border-radius:24px;padding:24px;animation:pop .25s}
.modal h3{font-size:19px;font-weight:800;color:var(--ink);margin-bottom:6px}
.modal p{font-size:13px;color:var(--sub);margin-bottom:16px;line-height:1.5}
.modal input{width:100%;height:50px;border-radius:14px;border:1.5px solid #e8e5f0;background:#faf9fd;padding:0 14px;font-size:15px;color:var(--ink);outline:none}
.modal input:focus{border-color:#8b8fd6;background:#fff}
.modal .actions{display:flex;gap:10px;margin-top:14px}
.modal .btn{flex:1;height:48px}
.modal .btn.ghost{background:#f2f1f7;color:var(--ink)}
.modal .btn.primary{background:#14141a;color:#fff}
</style>
</head>
<body>

<!-- AUTH -->
<section id="auth" class="screen active">
  <div class="auth-card">
    <h1 id="auth-title">Welcome back</h1>
    <p id="auth-sub">Chat by email — no phone number needed.</p>
    <div class="err" id="auth-err"></div>
    <input id="auth-name" type="text" placeholder="Display name" autocomplete="name" style="display:none">
    <input id="auth-email" type="email" placeholder="you@example.com" autocomplete="email" spellcheck="false">
    <input id="auth-pass" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn" id="auth-btn">Log in</button>
    <div class="auth-swap">
      <span id="auth-swap-text">Don't have an account?</span>
      <a id="auth-swap-link">Sign up</a>
    </div>
  </div>
</section>

<!-- LIST -->
<section id="list" class="screen">
  <div class="list-top">
    <div class="row">
      <div class="search-pill">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="search" type="text" placeholder="Search chats">
      </div>
    </div>
    <h1 class="list-title">Your Chats</h1>
  </div>
  <div class="me-bar">
    <div class="avatar" id="me-av">?</div>
    <div><b id="me-name">…</b><br><small id="me-email">…</small></div>
  </div>
  <div class="chats" id="chats"><div class="empty">Loading…</div></div>
  <button class="logout" onclick="logout()">Log out</button>
  <button class="fab" onclick="openNewChat()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    New Chat
  </button>
</section>

<!-- CHAT -->
<section id="chat" class="screen">
  <div class="chat-head">
    <button class="icn back" onclick="closeChat()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <div class="avatar" id="chat-av">?</div>
    <div class="who"><b id="chat-name">…</b><small id="chat-sub">…</small></div>
  </div>
  <div class="chat-body" id="chat-body">
    <div id="msgs"></div>
    <div class="typing" id="typing">typing<span class="dots"><i></i><i></i><i></i></span></div>
  </div>
  <form class="chat-input" id="chat-form">
    <input id="chat-text" type="text" placeholder="Message…" autocomplete="off">
    <button type="submit">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3L10.5 13.5"/><path d="M21 3l-7 18-3.5-7.5L3 10z"/></svg>
    </button>
  </form>
</section>

<!-- NEW CHAT MODAL -->
<div class="modal-wrap" id="modal">
  <div class="modal">
    <h3>New chat</h3>
    <p>Enter the email address of the person you want to chat with.</p>
    <input id="new-email" type="email" placeholder="friend@example.com" spellcheck="false">
    <div class="err" id="modal-err" style="margin-top:8px"></div>
    <div class="actions">
      <button class="btn ghost" onclick="closeModal()">Cancel</button>
      <button class="btn primary" onclick="startChat()">Start</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const API = ''; // same origin (works locally and if frontend is served by the backend)
let token = localStorage.getItem('token');
let me = null, socket = null, currentChat = null, chatsCache = [];

/* ---------- helpers ---------- */
async function api(path, opts={}) {
  const headers = { 'Content-Type':'application/json', ...(opts.headers||{}) };
  if (token) headers.Authorization = 'Bearer ' + token;
  const res = await fetch(API + path, { ...opts, headers });
  const data = await res.json().catch(()=>({}));
  if (!res.ok) throw new Error(data.error || 'Request failed');
  return data;
}
function show(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active')); document.getElementById(id).classList.add('active'); }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function initials(name){ return (name||'?').split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function timeAgo(t){ if(!t) return ''; const d=new Date(t); const diff=(Date.now()-d)/1000;
  if(diff<60) return 'now'; if(diff<3600) return Math.floor(diff/60)+'m'; if(diff<86400) return Math.floor(diff/3600)+'h';
  return d.toLocaleDateString(); }
function nowTime(){ const d=new Date(); let h=d.getHours(); const m=String(d.getMinutes()).padStart(2,'0'); const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+m+' '+ap; }

/* ---------- auth ---------- */
let signupMode = false;
const authTitle = document.getElementById('auth-title');
const authSub = document.getElementById('auth-sub');
const authName = document.getElementById('auth-name');
const authBtn = document.getElementById('auth-btn');
const authSwapText = document.getElementById('auth-swap-text');
const authSwapLink = document.getElementById('auth-swap-link');
const authErr = document.getElementById('auth-err');

authSwapLink.onclick = () => {
  signupMode = !signupMode;
  authTitle.textContent = signupMode ? 'Create account' : 'Welcome back';
  authSub.textContent = signupMode ? 'Chat by email — no phone number needed.' : 'Log in with your email.';
  authName.style.display = signupMode ? 'block' : 'none';
  authBtn.textContent = signupMode ? 'Sign up' : 'Log in';
  authSwapText.textContent = signupMode ? 'Already have an account?' : "Don't have an account?";
  authSwapLink.textContent = signupMode ? 'Log in' : 'Sign up';
  authErr.textContent = '';
};

authBtn.onclick = async () => {
  authErr.textContent = '';
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-pass').value;
  const display_name = authName.value.trim();
  if (!email || !password) { authErr.textContent = 'Email and password required.'; return; }
  try {
    const path = signupMode ? '/api/signup' : '/api/login';
    const body = signupMode ? { email, password, display_name } : { email, password };
    const data = await api(path, { method:'POST', body: JSON.stringify(body) });
    token = data.token;
    localStorage.setItem('token', token);
    me = data.user;
    await enterApp();
  } catch(e) { authErr.textContent = e.message; }
};

async function boot(){
  if (!token) { show('auth'); return; }
  try { me = await api('/api/me'); await enterApp(); }
  catch { localStorage.removeItem('token'); token = null; show('auth'); }
}

function logout(){
  localStorage.removeItem('token');
  token = null; me = null;
  if (socket) socket.disconnect();
  location.reload();
}

/* ---------- app ---------- */
async function enterApp(){
  show('list');
  document.getElementById('me-name').textContent = me.display_name;
  document.getElementById('me-email').textContent = me.email;
  const av = document.getElementById('me-av');
  av.textContent = initials(me.display_name);
  av.style.background = me.avatar_color || 'linear-gradient(135deg,#7b8cff,#b58cff)';
  connectSocket();
  await loadChats();
}

function connectSocket(){
  if (socket) socket.disconnect();
  socket = io({ auth: { token } });
  socket.on('connect', ()=>console.log('socket connected'));
  socket.on('message', m=>{
    if (currentChat && Number(currentChat.id) === Number(m.chat_id)) appendBubble(m, m.sender_id !== me.id);
    loadChats();
  });
  socket.on('typing', ({ userId, typing })=>{
    if (!currentChat || userId === me.id) return;
    document.getElementById('typing').style.display = typing ? 'flex' : 'none';
  });
}

/* ---------- chat list ---------- */
async function loadChats(){
  try {
    chatsCache = await api('/api/chats');
    renderChats();
  } catch(e){ console.error(e); }
}
function renderChats(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const box = document.getElementById('chats');
  const list = chatsCache.filter(c => !q || (c.name||'').toLowerCase().includes(q) || String(c.id).includes(q));
  if (!list.length) { box.innerHTML = '<div class="empty">No chats yet.<br>Tap "New Chat" to start one.</div>'; return; }
  box.innerHTML = list.map(c=>{
    const name = c.name || ('Chat #' + c.id);
    return '<div class="chat-item" data-id="'+c.id+'">'
      + '<div class="avatar" style="background:linear-gradient(135deg,#7b8cff,#b58cff)">'+esc(initials(name))+'</div>'
      + '<div class="meta"><b>'+esc(name)+'</b><small>'+esc(c.last_message || 'No messages yet')+'</small></div>'
      + '<small style="color:#b9b6c2;font-size:11.5px;font-weight:600">'+timeAgo(c.last_at)+'</small>'
      + '</div>';
  }).join('');
  box.querySelectorAll('.chat-item').forEach(el => el.onclick = ()=> openChat(Number(el.dataset.id)));
}
document.getElementById('search').addEventListener('input', renderChats);

/* ---------- open chat ---------- */
async function openChat(id){
  const summary = chatsCache.find(c=>Number(c.id)===id) || { id, name: 'Chat #' + id };
  currentChat = summary;
  show('chat');
  document.getElementById('chat-name').textContent = summary.name || ('Chat #' + id);
  document.getElementById('chat-sub').textContent = 'via email';
  const av = document.getElementById('chat-av');
  av.textContent = initials(summary.name || 'C');
  av.style.background = 'linear-gradient(135deg,#7b8cff,#b58cff)';

  const msgs = document.getElementById('msgs');
  msgs.innerHTML = '<div class="empty" style="color:#5f5b80">Loading…</div>';
  try {
    const rows = await api('/api/chats/' + id + '/messages');
    msgs.innerHTML = '';
    rows.forEach(m => appendBubble(m, m.sender_id !== me.id));
    scrollBottom();
    if (socket) socket.emit('join', id);
  } catch(e){ msgs.innerHTML = '<div class="empty">'+esc(e.message)+'</div>'; }
}

function appendBubble(m, incoming){
  const msgs = document.getElementById('msgs');
  const t = new Date(m.created_at || Date.now()).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  const d = document.createElement('div');
  d.className = 'bubble ' + (incoming ? 'in' : 'out');
  d.innerHTML = esc(m.body) + '<span class="t">' + t + '</span>';
  msgs.appendChild(d);
  scrollBottom();
}
function scrollBottom(){ requestAnimationFrame(()=>{ const b=document.getElementById('chat-body'); b.scrollTop=b.scrollHeight; }); }

function closeChat(){
  if (socket && currentChat) socket.emit('leave', currentChat.id);
  currentChat = null;
  show('list');
  loadChats();
}

/* ---------- send ---------- */
let typingTimer = null;
document.getElementById('chat-text').addEventListener('input', ()=>{
  if (!socket || !currentChat) return;
  socket.emit('typing', { chatId: currentChat.id, typing: true });
  clearTimeout(typingTimer);
  typingTimer = setTimeout(()=> socket.emit('typing', { chatId: currentChat.id, typing: false }), 1200);
});

document.getElementById('chat-form').addEventListener('submit', async e=>{
  e.preventDefault();
  if (!currentChat) return;
  const inp = document.getElementById('chat-text');
  const body = inp.value.trim();
  if (!body) return;
  inp.value = '';
  try {
    const m = await api('/api/chats/' + currentChat.id + '/messages', { method:'POST', body: JSON.stringify({ body }) });
    if (!document.querySelector('#msgs .bubble:last-child') || Number(document.querySelector('#msgs .bubble:last-child').dataset.id||0) !== m.id) {
      appendBubble(m, false);
    }
    loadChats();
  } catch(e){ alert(e.message); }
});

/* ---------- new chat ---------- */
function openNewChat(){ document.getElementById('modal').classList.add('show'); document.getElementById('new-email').focus(); document.getElementById('modal-err').textContent=''; }
function closeModal(){ document.getElementById('modal').classList.remove('show'); }
async function startChat(){
  const email = document.getElementById('new-email').value.trim();
  const err = document.getElementById('modal-err');
  err.textContent = '';
  if (!email) { err.textContent = 'Enter an email.'; return; }
  try {
    const { chat_id } = await api('/api/chats/dm', { method:'POST', body: JSON.stringify({ email }) });
    closeModal();
    document.getElementById('new-email').value = '';
    await loadChats();
    openChat(chat_id);
  } catch(e){ err.textContent = e.message; }
}
document.getElementById('new-email').addEventListener('keydown', e=>{ if(e.key==='Enter') startChat(); });
document.getElementById('modal').addEventListener('click', e=>{ if(e.target.id==='modal') closeModal(); });

/* ---------- go ---------- */
boot();
</script>
</body>
</html>
