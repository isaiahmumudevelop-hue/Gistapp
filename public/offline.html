<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — GistApp</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0a0a0d;color:#fff;font-family:-apple-system,Inter,sans-serif;padding:24px;text-align:center}
.box{max-width:340px}
.icon{font-size:64px;margin-bottom:20px}
h1{font-size:22px;font-weight:800;margin:0 0 12px}
p{font-size:14.5px;line-height:1.6;color:#8e8e96;margin:0 0 24px}
button{background:#7b8cff;color:#fff;border:none;padding:14px 28px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="box">
  <div class="icon">📡</div>
  <h1>You're offline</h1>
  <p>GistApp needs an internet connection to load new messages and content. Reconnect and try again.</p>
  <button onclick="location.reload()">Retry</button>
</div>
</body>
</html>
